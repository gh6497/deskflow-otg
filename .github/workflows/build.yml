name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-14
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-x86_64
          - os: windows-latest
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake libusb
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libusb:x64-windows-static
      - name: Download verified ADB distribution
        run: python scripts/fetch_adb.py --output adb-bundle
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DBUILD_GUI=ON -DADB_BUNDLE_DIR="$PWD/adb-bundle/platform-tools" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror" -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - name: Configure Windows with vcpkg
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DBUILD_GUI=ON -DADB_BUNDLE_DIR="$pwd/adb-bundle/platform-tools" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check CLI
        if: runner.os != 'Windows'
        run: ./build/deskflow-otg --help
      - name: Check CLI (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/deskflow-otg.exe --help
      - name: Stage desktop distribution
        run: cmake --install build --config Release --prefix stage
      - name: Include dependency licenses
        run: python scripts/fetch_licenses.py --output stage/share/deskflow-otg/licenses
      - name: Package (Linux / macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/deskflow-otg-${{ matrix.asset }}.tar.gz" -C build deskflow-otg
          tar -czf "dist/deskflow-otg-gui-${{ matrix.asset }}.tar.gz" -C stage .
      - name: Package (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path build/Release/deskflow-otg.exe -DestinationPath "dist/deskflow-otg-${{ matrix.asset }}.zip"
          Compress-Archive -Path stage/* -DestinationPath "dist/deskflow-otg-gui-${{ matrix.asset }}.zip"
      - name: Save release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
