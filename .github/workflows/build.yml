name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches-ignore:
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  companion:
    if: ${{ !startsWith(github.ref_name, 'doc/') && !startsWith(github.head_ref, 'doc/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy SDK "tools" package was removed from current
          # repositories. setup-android defaults to installing it, so request
          # only the still-supported platform tools explicitly.
          packages: platform-tools
      - name: Install fixed Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test signing helper
        run: python -m unittest discover -s tests -p test_sign_companion_apk.py
      - name: Build and test release APK
        working-directory: android/deskflow-otg
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      # PR code must never receive signing credentials (including same-repo PRs).
      # Unsigned test artifacts are not distributed to desktop packages.
      - name: Sign and verify companion APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/sign_companion_apk.py --input android/deskflow-otg/app/build/outputs/apk/release/app-release-unsigned.apk --output companion-bundle/deskflow-otg-companion.apk
      - name: Share signed APK with desktop builds
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: companion-signed
          path: companion-bundle/deskflow-otg-companion.apk
          if-no-files-found: error

  build:
    if: ${{ !startsWith(github.ref_name, 'doc/') && !startsWith(github.head_ref, 'doc/') }}
    needs: companion
    env:
      COMPANION_APK: ${{ github.event_name != 'pull_request' && format('{0}/companion-bundle/deskflow-otg-companion.apk', github.workspace) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-15
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-x86_64
          - os: windows-latest
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download signed companion APK
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: companion-signed
          path: companion-bundle
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libssl-dev libasound2-dev libglib2.0-dev libgtk-3-0t64 bluez dbus
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake libusb openssl@3
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libusb:x64-windows-static openssl:x64-windows-static openssl:x64-windows-static-md
      - name: Download verified ADB distribution
        run: python scripts/fetch_adb.py --output adb-bundle
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DBUILD_GUI=ON -DBUILD_CLIPBOARD=ON -DOTG_RELEASE_TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}" -DADB_BUNDLE_DIR="$PWD/adb-bundle/platform-tools" -DCOMPANION_APK="$COMPANION_APK" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror" -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - name: Enable Linux audio
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DBUILD_AUDIO=ON -DSCRCPY_VERSION=5.0.1
      - name: Configure Windows with vcpkg
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DBUILD_GUI=ON -DBUILD_BLE_WIN=ON -DBUILD_AUDIO=ON -DBUILD_CLIPBOARD=ON -DOTG_RELEASE_TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}" -DADB_BUNDLE_DIR="$pwd/adb-bundle/platform-tools" -DCOMPANION_APK="$env:COMPANION_APK" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: USB-only Linux compatibility
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-usb -DBUILD_BLE=OFF -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror" -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-usb --parallel
          ctest --test-dir build-usb --output-on-failure
      - name: Check CLI
        if: runner.os != 'Windows'
        run: ./build/deskflow-otg --help
      - name: USB-only Windows GUI compatibility
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build-usb -DBUILD_GUI=ON -DBUILD_BLE_WIN=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build-usb --config Release --parallel
          ctest --test-dir build-usb -C Release --output-on-failure
      - name: Check CLI (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/deskflow-otg.exe --help
      - name: Stage desktop distribution
        # Qt's qt.conf generator requires an absolute install prefix.
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"
      - name: Include dependency licenses
        run: python scripts/fetch_licenses.py --output stage/share/deskflow-otg/licenses
      - name: Check installed companion APK matches the signed artifact
        if: github.event_name != 'pull_request'
        run: cmake "-DGUI_DIR=${{ github.workspace }}/stage/${{ runner.os == 'macOS' && 'deskflow-otg-gui.app/Contents/MacOS' || 'bin' }}" "-DCOMPANION_APK=${{ env.COMPANION_APK }}" -P tests/test_gui_runtime.cmake
      - name: Check Linux theme deployment
        if: runner.os == 'Linux'
        run: |
          test -f stage/plugins/platformthemes/libqgtk3.so
          test -f stage/plugins/platformthemes/libqxdgdesktopportal.so
      - name: Test DMG packaging layout
        run: python -m unittest discover -s tests -p test_package_dmg.py
      - name: Test Windows installer layout
        run: python -m unittest discover -s tests -p test_package_windows.py
      - name: Test build version packaging
        run: python -m unittest discover -s tests -p test_package_version.py
      - name: Test Debian desktop integration
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p test_package_deb.py
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH (Join-Path ${env:ProgramFiles(x86)} 'NSIS')
      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package_windows.py --stage stage --output "dist/deskflow-otg-gui-windows-x86_64-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/deskflow-otg-gui-windows-x86_64-setup.exe")) { throw 'Installer missing' }
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs/Deskflow OTG'
          $installer = (Resolve-Path 'dist/deskflow-otg-gui-windows-x86_64-setup.exe').Path
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          foreach ($file in @('bin/deskflow-otg-gui.exe', 'bin/deskflow-otg.exe', 'bin/platform-tools/adb.exe', 'share/deskflow-otg/licenses/libusb-LGPL-2.1.txt')) {
            if (-not (Test-Path (Join-Path $installDir $file))) { throw "Missing installed file: $file" }
          }
          if ($env:COMPANION_APK) {
            $installedApk = Join-Path $installDir 'bin/deskflow-otg-companion.apk'
            if ((Get-FileHash $installedApk).Hash -ne (Get-FileHash $env:COMPANION_APK).Hash) { throw 'Installed APK mismatch' }
          }
          $process = Start-Process -FilePath (Join-Path $installDir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          if (Test-Path (Join-Path $installDir 'bin/deskflow-otg-gui.exe')) { throw 'Uninstaller left GUI behind' }
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          python scripts/package_dmg.py --stage stage --output "dist/deskflow-otg-gui-${{ matrix.asset }}.dmg"
          hdiutil verify "dist/deskflow-otg-gui-${{ matrix.asset }}.dmg"
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" || true; rmdir "$mount_dir"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "dist/deskflow-otg-gui-${{ matrix.asset }}.dmg"
          test -L "$mount_dir/Applications"
          test -x "$mount_dir/deskflow-otg-gui.app/Contents/MacOS/deskflow-otg"
          test -x "$mount_dir/deskflow-otg-gui.app/Contents/MacOS/platform-tools/adb"
          if [ -n "$COMPANION_APK" ]; then
            cmp "$COMPANION_APK" "$mount_dir/deskflow-otg-gui.app/Contents/MacOS/deskflow-otg-companion.apk"
          fi
          test -f "$mount_dir/deskflow-otg-gui.app/Contents/Resources/deskflow-otg/licenses/libusb-LGPL-2.1.txt"
      - name: Package Debian (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/package_deb.py --stage stage --version "${GITHUB_REF_NAME#v}" --output "dist/deskflow-otg-gui-${GITHUB_REF_NAME#v}-linux-amd64.deb"
          dpkg-deb --field "dist/deskflow-otg-gui-${GITHUB_REF_NAME#v}-linux-amd64.deb" Package Version Architecture Depends
          dpkg-deb --contents "dist/deskflow-otg-gui-${GITHUB_REF_NAME#v}-linux-amd64.deb" | grep 'opt/deskflow-otg/bin/deskflow-otg-gui'
          dpkg-deb --fsys-tarfile "dist/deskflow-otg-gui-${GITHUB_REF_NAME#v}-linux-amd64.deb" | tar -xOf - ./opt/deskflow-otg/bin/deskflow-otg-companion.apk | cmp "$COMPANION_APK" -
      - name: Download verified appimagetool (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fL --retry 3 -o appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage' | sha256sum -c -
          curl -fL --retry 3 -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64' | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/package_appimage.py --stage stage --appimagetool appimagetool-x86_64.AppImage --runtime runtime-x86_64 --output "dist/deskflow-otg-gui-linux-x86_64.AppImage"
          ./dist/deskflow-otg-gui-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/usr/bin/deskflow-otg-gui
          test -f squashfs-root/usr/lib/libusb-1.0.so.0
          if [ -n "$COMPANION_APK" ]; then
            cmp "$COMPANION_APK" squashfs-root/usr/bin/deskflow-otg-companion.apk
          fi
      - name: Package (Linux / macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            mkdir -p build/cli-package
            cp build/deskflow-otg build/cli-package/deskflow-otg
            cp third_party/scrcpy/scrcpy-server-v5.0.1 build/cli-package/scrcpy-server
            tar -czf "dist/deskflow-otg-${{ matrix.asset }}.tar.gz" -C build/cli-package .
          else
            tar -czf "dist/deskflow-otg-${{ matrix.asset }}.tar.gz" -C build deskflow-otg
          fi
          tar -czf "dist/deskflow-otg-gui-${{ matrix.asset }}.tar.gz" -C stage .
      - name: Package (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path build/Release/deskflow-otg.exe -DestinationPath "dist/deskflow-otg-${{ matrix.asset }}.zip"
          Compress-Archive -Path stage/* -DestinationPath "dist/deskflow-otg-gui-${{ matrix.asset }}.zip"
      - name: Save release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    if: ${{ !startsWith(github.ref_name, 'doc/') && !startsWith(github.head_ref, 'doc/') && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
